name: Game and guide

on:
  pull_request:
    paths:
      - "game/**"
      - "art/item-icons/**"
      - "docs/game/**"
      - "docs-site/**"
      - "tools/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "art/item-icons/**"
      - "docs/game/**"
      - "docs-site/**"
      - "tools/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: corealm-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_BASE: /${{ github.event.repository.name }}/
  DOCS_BASE: /${{ github.event.repository.name }}/docs
  DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:build

  publish:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message || '', '[docs-sync]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:refresh

      - name: Commit refreshed Markdown and captures
        shell: bash
        run: |
          if git diff --quiet -- docs/game; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/game
          git commit -m "[docs-sync] refresh generated game guide"
          git push

      - run: npm run build
      - run: npm run docs:build

      - name: Stage game and guide
        shell: bash
        run: |
          mkdir -p pages-dist/docs
          cp -R game/dist/. pages-dist/
          cp -R dist/. pages-dist/docs/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
